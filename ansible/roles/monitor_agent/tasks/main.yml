---
- name: Validar repositório do agente
  ansible.builtin.assert:
    that:
      - monitor_agent_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
    fail_msg: >-
      monitor_agent_github_repository deve estar no formato proprietario/repositorio.
    quiet: true

- name: Validar versão do agente
  ansible.builtin.assert:
    that:
      - monitor_agent_release_tag is match('^agent-v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      monitor_agent_release_tag não foi informado ou não segue agent-vX.Y.Z.
    quiet: true

- name: Validar token do agente
  ansible.builtin.assert:
    that:
      - monitor_agent_token | trim | length > 0
    fail_msg: >-
      Cadastre MONITOR_AGENT_TOKEN como Secret do tipo Environment variable no
      Variable Group do Semaphore ou informe monitor_agent_token como variável Ansible.
    quiet: true

- name: Validar grupo do equipamento
  ansible.builtin.assert:
    that:
      - monitor_agent_group | trim | length > 0
    fail_msg: >-
      monitor_agent_group não foi informado no inventário para este equipamento.
    quiet: true

- name: Validar intervalo de coleta
  ansible.builtin.assert:
    that:
      - monitor_agent_interval_seconds | int >= 10
    fail_msg: monitor_agent_interval_seconds deve ser igual ou superior a 10.
    quiet: true

- name: Calcular URLs e caminho da versão do agente
  ansible.builtin.set_fact:
    monitor_agent_binary_url: >-
      https://github.com/{{ monitor_agent_github_repository }}/releases/download/{{
      monitor_agent_release_tag }}/monitor-agent.exe
    monitor_agent_checksum_url: >-
      https://github.com/{{ monitor_agent_github_repository }}/releases/download/{{
      monitor_agent_release_tag }}/monitor-agent.exe.sha256
    monitor_agent_binary_path: >-
      {{ monitor_agent_install_dir }}\monitor-agent-{{ monitor_agent_release_tag }}.exe

- name: Criar diretório do agente
  ansible.windows.win_file:
    path: '{{ monitor_agent_install_dir }}'
    state: directory

- name: Baixar binário validando integridade
  ansible.windows.win_get_url:
    url: '{{ monitor_agent_binary_url }}'
    dest: '{{ monitor_agent_binary_path }}'
    checksum_url: '{{ monitor_agent_checksum_url }}'
    checksum_algorithm: sha256
    force: false
  notify: restart carmel agent

- name: Gravar configuração do agente
  ansible.windows.win_template:
    src: config.json.j2
    dest: '{{ monitor_agent_config_path }}'
  no_log: true
  notify: restart carmel agent

- name: Resolver contas internas do Windows pelo SID
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false

      function Resolve-WellKnownSid([string] $Sid) {
          $identity = [System.Security.Principal.SecurityIdentifier]::new($Sid)
          return $identity.Translate([System.Security.Principal.NTAccount]).Value
      }

      $Ansible.Result = @{
          system         = Resolve-WellKnownSid 'S-1-5-18'
          local_service  = Resolve-WellKnownSid 'S-1-5-19'
          administrators = Resolve-WellKnownSid 'S-1-5-32-544'
      }
  register: monitor_agent_builtin_accounts

- name: Autorizar leitura da configuração ao serviço
  ansible.windows.win_acl:
    path: '{{ monitor_agent_config_path }}'
    user: '{{ item.user }}'
    rights: '{{ item.rights }}'
    type: allow
    state: present
  loop:
    - user: '{{ monitor_agent_builtin_accounts.result.system }}'
      rights: FullControl
    - user: '{{ monitor_agent_builtin_accounts.result.administrators }}'
      rights: FullControl
    - user: '{{ monitor_agent_builtin_accounts.result.local_service }}'
      rights: Read

- name: Remover permissões herdadas da configuração
  ansible.windows.win_acl_inheritance:
    path: '{{ monitor_agent_config_path }}'
    state: absent
    reorganize: false

- name: Registrar o serviço
  ansible.windows.win_service:
    name: '{{ monitor_agent_service_name }}'
    display_name: Carmel Monitor Agent
    description: Coleta métricas do equipamento para o Monitoramento Carmel.
    path: '"{{ monitor_agent_binary_path }}"'
    username: NT AUTHORITY\LocalService
    start_mode: delayed
    failure_actions:
      - type: restart
        delay_ms: 5000
      - type: restart
        delay_ms: 15000
      - type: restart
        delay_ms: 60000
    failure_reset_period_sec: 86400
  notify: restart carmel agent

- name: Iniciar o serviço
  block:
    - name: Iniciar Carmel Monitor Agent
      ansible.windows.win_service:
        name: '{{ monitor_agent_service_name }}'
        state: started

  rescue:
    - name: Coletar diagnóstico do Service Control Manager
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          ServiceName: '{{ monitor_agent_service_name }}'
        script: |
          param([string] $ServiceName)

          $Ansible.Changed = $false
          $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='$ServiceName'"
          $startTime = (Get-Date).AddMinutes(-10)
          $eventIds = 7000, 7001, 7009, 7011, 7023, 7024, 7031, 7034
          $events = Get-WinEvent -FilterHashtable @{
              LogName = 'System'
              Id = $eventIds
              StartTime = $startTime
          } -ErrorAction SilentlyContinue | Where-Object {
              $_.Message -like "*$ServiceName*" -or
              $_.Message -like '*Carmel Monitor Agent*'
          } | Select-Object -First 5

          $dependsOn = @(Get-Service -Name $ServiceName -ErrorAction SilentlyContinue |
              ForEach-Object { $_.ServicesDependedOn } |
              ForEach-Object { "$($_.Name)=$($_.Status)" })

          # Somente leitura: nada aqui altera serviços ou o sistema.
          $scmEvents = Get-WinEvent -FilterHashtable @{
              LogName = 'System'
              ProviderName = 'Service Control Manager'
              StartTime = (Get-Date).AddMinutes(-15)
          } -MaxEvents 8 -ErrorAction SilentlyContinue
          $exePath = ($service.PathName -replace '^"([^"]+)".*$', '$1')
          $exe = Get-Item -LiteralPath $exePath -ErrorAction SilentlyContinue
          $qc = (& sc.exe qc $ServiceName) -join ' | '

          $icaclsExe = (& icacls.exe $exePath) -join ' | '
          $icaclsDir = (& icacls.exe (Split-Path $exePath)) -join ' | '
          $qsid = (& sc.exe qsidtype $ServiceName) -join ' | '
          $qpriv = (& sc.exe qprivs $ServiceName) -join ' | '
          $blockEvents = @()
          foreach ($log in 'Microsoft-Windows-CodeIntegrity/Operational',
                           'Microsoft-Windows-AppLocker/EXE and DLL',
                           'Microsoft-Windows-Windows Defender/Operational') {
              $blockEvents += Get-WinEvent -FilterHashtable @{
                  LogName = $log
                  StartTime = (Get-Date).AddMinutes(-15)
              } -MaxEvents 5 -ErrorAction SilentlyContinue | ForEach-Object {
                  "$log id=$($_.Id) $($_.Message)"
              }
          }
          $appEvents = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              Level = 1, 2
              StartTime = (Get-Date).AddMinutes(-15)
          } -MaxEvents 5 -ErrorAction SilentlyContinue | ForEach-Object {
              "id=$($_.Id) $($_.ProviderName) $($_.Message)"
          }

          $Ansible.Result = @{
              icacls_exe = $icaclsExe
              icacls_dir = $icaclsDir
              sc_qsidtype = $qsid
              sc_qprivs = $qpriv
              block_events = @($blockEvents)
              app_errors = @($appEvents)
              sc_qc = $qc
              exe_exists = [bool] $exe
              exe_size = if ($exe) { $exe.Length } else { $null }
              scm_events = @($scmEvents | ForEach-Object {
                  "$($_.TimeCreated.ToString('s')) id=$($_.Id) $($_.Message)"
              })
              depends_on = $dependsOn
              state = $service.State
              start_name = $service.StartName
              path = $service.PathName
              win32_exit_code = $service.ExitCode
              service_exit_code = $service.ServiceSpecificExitCode
              events = @($events | ForEach-Object {
                  @{
                      time = $_.TimeCreated.ToString('s')
                      id = $_.Id
                      message = $_.Message
                  }
              })
          }
      register: monitor_agent_start_diagnostics

    - name: Informar causa da falha do serviço
      ansible.builtin.fail:
        msg: '{{ monitor_agent_start_diagnostics.result | to_nice_json }}'

- name: Aplicar reinício antes da limpeza
  ansible.builtin.meta: flush_handlers

- name: Localizar versões antigas
  ansible.windows.win_find:
    paths: '{{ monitor_agent_install_dir }}'
    patterns: monitor-agent-*.exe
    file_type: file
  register: monitor_agent_versions

- name: Remover versões antigas
  ansible.windows.win_file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ monitor_agent_versions.files }}'
  when: item.path | lower != monitor_agent_binary_path | lower

- name: Consultar estado final do serviço
  ansible.windows.win_service_info:
    name: '{{ monitor_agent_service_name }}'
  register: monitor_agent_service

- name: Confirmar que o agente está ativo
  ansible.builtin.assert:
    that:
      - monitor_agent_service.exists
      - monitor_agent_service.services[0].state == 'started'
    fail_msg: O serviço Carmel Monitor Agent não iniciou corretamente.
