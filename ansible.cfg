# Configuração do Ansible usada pelo Semaphore/linha de comando ao rodar os playbooks deste projeto.
# Vale para o diretório em que o ansible-playbook é executado (raiz do repositório).
[defaults]
# Onde o Ansible procura os roles (pacotes de tarefas reutilizáveis), por exemplo monitor_agent.
roles_path = ansible/roles
# Confere a identidade dos hosts em conexões SSH (proteção contra servidor falso).
# Obs.: os PCs Windows são acessados por WinRM, onde esta opção não se aplica.
host_key_checking = True
# Não cria arquivos .retry com a lista de hosts que falharam (evita lixo no repositório).
retry_files_enabled = False
# Tempo máximo, em segundos, para estabelecer a conexão com cada equipamento.
timeout = 30

[connection]
# Reduz o número de conexões por tarefa, deixando a execução mais rápida em muitos equipamentos.
pipelining = True
